plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voiceos.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.voiceos.android'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
